<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ServiceCrew AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">ServiceCrew AI Mobile</p>
      <h1>Local field-service shell</h1>
      <p>
        This build runs from bundled assets. It does not contact a private LAN
        address or external service until an operator supplies an HTTPS API URL.
      </p>

      <form id="settings-form">
        <label for="api-url">Service API URL</label>
        <input id="api-url" name="apiUrl" type="url" inputmode="url"
          placeholder="https://service.example.com" autocomplete="url" />
        <button type="submit">Save locally</button>
      </form>

      <section aria-live="polite" aria-atomic="true">
        <h2>Connection status</h2>
        <p id="status">No service configured. Bundled app is ready offline.</p>
        <button id="health-check" type="button">Check configured service</button>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
